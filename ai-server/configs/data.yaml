label_space:
  - toxic
  - severe_toxic
  - obscene
  - threat
  - insult
  - identity_hate

english:
  source:
    type: csv
    train_path: data/english/train_split.csv
    valid_path: data/english/valid.csv
    test_path: data/english/test_labeled.csv
    text_column: comment_text
    label_columns:
      toxic: toxic
      severe_toxic: severe_toxic
      obscene: obscene
      threat: threat
      insult: insult
      identity_hate: identity_hate

vietnamese:
  source:
    type: csv
    train_path: data/vietnamese/train.csv
    valid_path: data/vietnamese/valid.csv
    test_path: data/vietnamese/test.csv
    text_column: Comment
    label_columns:
      toxic: toxic
      severe_toxic: severe_toxic
      obscene: obscene
      threat: threat
      insult: insult
      identity_hate: identity_hate

preprocess:
  lowercase: true
  normalize_vi_ascii: false
  keep_original_if_ascii: true
  strip_urls: true
  strip_mentions: true
  collapse_spaces: true
  duplicate_vi_no_diacritic: false

mixing:
  vi_ratio: 0.7
  en_ratio: 0.3
  oversample_vi: true

split:
  random_state: 42
  shuffle: true

class_balance:
  use_pos_weight: true
  clamp_min: 0.25
  clamp_max: 10.0
