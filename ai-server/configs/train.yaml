seed: 42
base_model: xlm-roberta-base
max_length: 192
num_workers: 2
threshold_default: 0.5

trainer:
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  logging_steps: 50
  save_total_limit: 2
  evaluation_strategy: epoch
  save_strategy: epoch
  load_best_model_at_end: true
  metric_for_best_model: macro_f1
  greater_is_better: true

stages:
  en:
    enabled: true
    num_train_epochs: 2
    per_device_train_batch_size: 16
    per_device_eval_batch_size: 32
    gradient_accumulation_steps: 1
    fp16: true
    gradient_checkpointing: false
    output_subdir: en_stage
  vi:
    enabled: true
    num_train_epochs: 3
    per_device_train_batch_size: 16
    per_device_eval_batch_size: 32
    gradient_accumulation_steps: 1
    fp16: true
    gradient_checkpointing: false
    output_subdir: vi_stage
  mix:
    enabled: true
    num_train_epochs: 3
    per_device_train_batch_size: 16
    per_device_eval_batch_size: 32
    gradient_accumulation_steps: 1
    fp16: true
    gradient_checkpointing: false
    output_subdir: mix_stage

paths:
  artifacts_root: artifacts
  checkpoints_dir: checkpoints
  reports_dir: reports
  exports_dir: exports
