name: ${COMPOSE_PROJECT_NAME:-tiktok_clone}_development

services:
  backend-nginx:
    container_name: ${CONTAINER_PREFIX:-tiktok_clone}_backend_nginx
    image: nginx:latest
    restart: unless-stopped
    environment:
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-*}
      NGINX_ENVSUBST_TEMPLATE_DIR: /etc/nginx/templates
      NGINX_ENVSUBST_TEMPLATE_SUFFIX: .template
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: ^CORS_ALLOW_ORIGIN$
    volumes:
      - ./backend/:/var/www
      - ./.docker/common/nginx/backend-templates:/etc/nginx/templates:ro
    ports:
      - "${NGINX_BACKEND_PORT:-${NGINX_PORT:-9696}}:80"
    networks:
      - app-development
    depends_on:
      php-fpm:
        condition: service_started

  frontend-nginx:
    container_name: ${CONTAINER_PREFIX:-tiktok_clone}_frontend_nginx
    image: nginx:latest
    restart: unless-stopped
    environment:
      NGINX_ENVSUBST_TEMPLATE_DIR: /etc/nginx/templates
      NGINX_ENVSUBST_TEMPLATE_SUFFIX: .template
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    volumes:
      - ./.docker/common/nginx/frontend-templates:/etc/nginx/templates:ro
    ports:
      - "${NGINX_FRONTEND_PORT:-9697}:80"
    networks:
      - app-development
    depends_on:
      frontend:
        condition: service_started

  php-fpm:
    container_name: ${CONTAINER_PREFIX:-tiktok_clone}_php-fpm
    build:
      context: .
      dockerfile: ./.docker/common/backend/php-fpm/Dockerfile
      target: development
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        XDEBUG_ENABLED: ${XDEBUG_ENABLED:-true}
        XDEBUG_MODE: ${XDEBUG_MODE:-develop,coverage,debug,profile}
        XDEBUG_HOST: ${XDEBUG_HOST:-host.docker.internal}
        XDEBUG_IDE_KEY: ${XDEBUG_IDE_KEY:-DOCKER}
        XDEBUG_LOG: ${XDEBUG_LOG:-/dev/stdout}
        XDEBUG_LOG_LEVEL: ${XDEBUG_LOG_LEVEL:-0}
        DOCKER_ENV: ${DOCKER_ENV:-development}
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env}
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./backend/:/var/www
    networks:
      - app-development
    depends_on:
      postgres:
        condition: service_started

  workspace:
    container_name: ${CONTAINER_PREFIX:-tiktok_clone}_workspace
    build:
      context: .
      dockerfile: ./.docker/development/backend/workspace/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        XDEBUG_ENABLED: ${XDEBUG_ENABLED:-true}
        XDEBUG_MODE: develop,coverage,debug,profile
        XDEBUG_HOST: ${XDEBUG_HOST:-host.docker.internal}
        XDEBUG_IDE_KEY: ${XDEBUG_IDE_KEY:-DOCKER}
        XDEBUG_LOG: /dev/stdout
        XDEBUG_LOG_LEVEL: 0
    tty: true
    stdin_open: true
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env}
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - ./backend/:/var/www
    networks:
      - app-development

  worker:
    container_name: ${CONTAINER_PREFIX:-tiktok_clone}_worker
    build:
      context: .
      dockerfile: ./.docker/development/backend/workspace/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        XDEBUG_ENABLED: ${XDEBUG_ENABLED:-true}
        XDEBUG_MODE: develop,coverage,debug,profile
        XDEBUG_HOST: ${XDEBUG_HOST:-host.docker.internal}
        XDEBUG_IDE_KEY: ${XDEBUG_IDE_KEY:-DOCKER}
        XDEBUG_LOG: /dev/stdout
        XDEBUG_LOG_LEVEL: 0
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env}
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    command: ["/usr/bin/supervisord", "-c", "/etc/supervisord.conf"]
    volumes:
      - ./backend/:/var/www
      - ./.docker/development/backend/worker/supervisord.conf:/etc/supervisord.conf:ro
    networks:
      - app-development
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started

  postgres:
    container_name: ${CONTAINER_PREFIX:-tiktok_clone}_postgres
    image: postgres:12.7
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tiktok_clone}
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tiktok_clone_password}
    volumes:
      - postgres-data-development:/var/lib/postgresql
    networks:
      - app-development

  redis:
    container_name: ${CONTAINER_PREFIX:-tiktok_clone}_redis
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379" #only expose to host for development, in production it should be internal only
    networks:
      - app-development

  frontend:
    container_name: ${CONTAINER_PREFIX:-tiktok_clone}_frontend
    build:
      context: .
      dockerfile: ./.docker/development/frontend/Dockerfile
    restart: unless-stopped
    env_file:
      - ${FRONTEND_ENV_FILE:-./frontend/.env}
    environment:
      NEXT_APP_ENV: ${NEXT_APP_ENV:-development}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    expose:
      - "3000"
    networks:
      - app-development

  mailcatcher:
    image: dockage/mailcatcher:0.7.1
    container_name: ${CONTAINER_PREFIX:-tiktok_clone}_mailcatcher
    ports:
      - ${MAILCATCHER_WEB_PORT:-1080}:1080
      - ${MAILCATCHER_SMTP_PORT:-1025}:1025
    networks:
      - app-development
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-02-03T21-03-04Z
    container_name: ${CONTAINER_PREFIX:-tiktok_clone}_minio
    command: minio server /data --console-address ":9001"
    volumes:
      - minio-data-development:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_root_user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_root_password}
    ports:
      - ${MINIO_PORT:-9000}:9000
      - ${MINIO_PORT_CONSOLE:-9001}:9001
    networks:
      - app-development
    restart: unless-stopped

networks:
  app-development:

volumes:
  postgres-data-development:
  frontend_node_modules:
  minio-data-development:
