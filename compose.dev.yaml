name: ${COMPOSE_PROJECT_NAME:-chat_app}_development

services:
  web-server:
    container_name: ${CONTAINER_PREFIX:-chat_app}_web
    image: nginx:latest
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-*}
      NGINX_ENVSUBST_TEMPLATE_DIR: /etc/nginx/templates
      NGINX_ENVSUBST_TEMPLATE_SUFFIX: .template
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: ^CORS_ALLOW_ORIGIN$
    volumes:
      - ./backend/:/var/www
      - ./.docker/development/backend/nginx/nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
    ports:
      - "${NGINX_PORT:-9696}:80"
    networks:
      - app-development
    depends_on:
      php-fpm:
        condition: service_started
      frontend:
        condition: service_started

  php-fpm:
    container_name: ${CONTAINER_PREFIX:-chat_app}_php-fpm
    build:
      context: .
      dockerfile: ./.docker/common/backend/php-fpm/Dockerfile
      target: development
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        XDEBUG_ENABLED: ${XDEBUG_ENABLED:-true}
        XDEBUG_MODE: ${XDEBUG_MODE:-develop,coverage,debug,profile}
        XDEBUG_HOST: ${XDEBUG_HOST:-host.docker.internal}
        XDEBUG_IDE_KEY: ${XDEBUG_IDE_KEY:-DOCKER}
        XDEBUG_LOG: ${XDEBUG_LOG:-/dev/stdout}
        XDEBUG_LOG_LEVEL: ${XDEBUG_LOG_LEVEL:-0}
        DOCKER_ENV: ${DOCKER_ENV:-development}
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./backend/:/var/www
    networks:
      - app-development
    depends_on:
      postgres:
        condition: service_started

  workspace:
    container_name: ${CONTAINER_PREFIX:-chat_app}_workspace
    build:
      context: .
      dockerfile: ./.docker/development/backend/workspace/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        XDEBUG_ENABLED: ${XDEBUG_ENABLED:-true}
        XDEBUG_MODE: develop,coverage,debug,profile
        XDEBUG_HOST: ${XDEBUG_HOST:-host.docker.internal}
        XDEBUG_IDE_KEY: ${XDEBUG_IDE_KEY:-DOCKER}
        XDEBUG_LOG: /dev/stdout
        XDEBUG_LOG_LEVEL: 0
    tty: true
    stdin_open: true
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - ./backend/:/var/www
    networks:
      - app-development

  postgres:
    container_name: ${CONTAINER_PREFIX:-chat_app}_postgres
    image: postgres:12.7
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-chat_app}
      POSTGRES_USER: ${DB_USERNAME:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chat_app_password}
    volumes:
      - postgres-data-development:/var/lib/postgresql
    networks:
      - app-development

  redis:
    container_name: ${CONTAINER_PREFIX:-chat_app}_redis
    image: redis:alpine
    restart: unless-stopped
    networks:
      - app-development

  frontend:
    image: tiktok-clone-frontend:dev
    build:
      context: ./Frontend
      dockerfile: ./.docker/development/frontend/Dockerfile
    restart: unless-stopped
    env_file:
      - ./Frontend/.env
    environment:
      NEXT_APP_ENV: development
      NEXT_PUBLIC_API_ENDPOINT: ${NEXT_PUBLIC_API_ENDPOINT:-http://localhost:9696/api}
      NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL:-http://localhost:9696}
      NEXT_PUBLIC_GOOGLE_AUTHORIZED_REDIRECT_URI: ${NEXT_PUBLIC_GOOGLE_AUTHORIZED_REDIRECT_URI:-http://localhost:9696/api/auth/google/callback}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-your-google-client-id}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./Frontend:/app
      - frontend_node_modules:/app/node_modules
    expose:
      - "3000"
    networks:
      - app-development

networks:
  app-development:

volumes:
  postgres-data-development:
  frontend_node_modules:
