name: ${COMPOSE_PROJECT_NAME:-snapi}_development

services:
  backend-nginx:
    container_name: ${CONTAINER_PREFIX:-snapi}_backend_nginx
    image: nginx:latest
    restart: unless-stopped
    environment:
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-*}
      NGINX_ENVSUBST_TEMPLATE_DIR: /etc/nginx/templates
      NGINX_ENVSUBST_TEMPLATE_SUFFIX: .template
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: ^CORS_ALLOW_ORIGIN$
    volumes:
      - ./backend/:/var/www
      - ./.docker/common/nginx/backend-templates:/etc/nginx/templates:ro
    ports:
      - "${NGINX_BACKEND_PORT:-${NGINX_PORT:-9696}}:80"
    networks:
      - app-development
    depends_on:
      php-fpm:
        condition: service_started

  frontend-nginx:
    container_name: ${CONTAINER_PREFIX:-snapi}_frontend_nginx
    image: nginx:latest
    restart: unless-stopped
    environment:
      NGINX_ENVSUBST_TEMPLATE_DIR: /etc/nginx/templates
      NGINX_ENVSUBST_TEMPLATE_SUFFIX: .template
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    volumes:
      - ./.docker/common/nginx/frontend-templates:/etc/nginx/templates:ro
    ports:
      - "${NGINX_FRONTEND_PORT:-9697}:80"
    networks:
      - app-development
    depends_on:
      frontend:
        condition: service_started

  php-fpm:
    container_name: ${CONTAINER_PREFIX:-snapi}_php-fpm
    build:
      context: .
      dockerfile: ./.docker/common/backend/php-fpm/Dockerfile
      target: development
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        XDEBUG_ENABLED: ${XDEBUG_ENABLED:-true}
        XDEBUG_MODE: ${XDEBUG_MODE:-develop,coverage,debug,profile}
        XDEBUG_HOST: ${XDEBUG_HOST:-host.docker.internal}
        XDEBUG_IDE_KEY: ${XDEBUG_IDE_KEY:-DOCKER}
        XDEBUG_LOG: ${XDEBUG_LOG:-/dev/stdout}
        XDEBUG_LOG_LEVEL: ${XDEBUG_LOG_LEVEL:-0}
        DOCKER_ENV: ${DOCKER_ENV:-development}
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env}
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    command: ["php-fpm", "-F"]
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./backend/:/var/www
    networks:
      - app-development
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started

  worker:
    container_name: ${CONTAINER_PREFIX:-snapi}_worker
    build:
      context: .
      dockerfile: ./.docker/common/backend/php-fpm/Dockerfile
      target: development
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        XDEBUG_ENABLED: ${XDEBUG_ENABLED:-true}
        XDEBUG_MODE: ${XDEBUG_MODE:-develop,coverage,debug,profile}
        XDEBUG_HOST: ${XDEBUG_HOST:-host.docker.internal}
        XDEBUG_IDE_KEY: ${XDEBUG_IDE_KEY:-DOCKER}
        XDEBUG_LOG: ${XDEBUG_LOG:-/dev/stdout}
        XDEBUG_LOG_LEVEL: ${XDEBUG_LOG_LEVEL:-0}
        DOCKER_ENV: ${DOCKER_ENV:-development}
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env}
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    command: ["/usr/bin/supervisord", "-c", "/etc/supervisord.backend.conf"]
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./backend/:/var/www
      - ./.docker/common/backend/php-fpm/supervisord.backend.conf:/etc/supervisord.backend.conf:ro
    networks:
      - app-development
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_started

  workspace:
    container_name: ${CONTAINER_PREFIX:-snapi}_workspace
    build:
      context: .
      dockerfile: ./.docker/development/backend/workspace/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        XDEBUG_ENABLED: ${XDEBUG_ENABLED:-true}
        XDEBUG_MODE: develop,coverage,debug,profile
        XDEBUG_HOST: ${XDEBUG_HOST:-host.docker.internal}
        XDEBUG_IDE_KEY: ${XDEBUG_IDE_KEY:-DOCKER}
        XDEBUG_LOG: /dev/stdout
        XDEBUG_LOG_LEVEL: 0
    tty: true
    stdin_open: true
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env}
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - ./backend/:/var/www
    networks:
      - app-development

  postgres:
    container_name: ${CONTAINER_PREFIX:-snapi}_postgres
    image: postgres:12.7
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-snapi}
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-snapi_password}
    volumes:
      - postgres-data-development:/var/lib/postgresql
    networks:
      - app-development

  redis:
    container_name: ${CONTAINER_PREFIX:-snapi}_redis
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379" #only expose to host for development, in production it should be internal only
    networks:
      - app-development

  frontend:
    container_name: ${CONTAINER_PREFIX:-snapi}_frontend
    build:
      context: .
      dockerfile: ./.docker/development/frontend/Dockerfile
    restart: unless-stopped
    env_file:
      - ${FRONTEND_ENV_FILE:-./frontend/.env}
    environment:
      NEXT_APP_ENV: ${NEXT_APP_ENV:-development}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    expose:
      - "3000"
    networks:
      - app-development

  mailcatcher:
    image: dockage/mailcatcher:0.7.1
    container_name: ${CONTAINER_PREFIX:-snapi}_mailcatcher
    ports:
      - ${MAILCATCHER_WEB_PORT:-1080}:1080
      - ${MAILCATCHER_SMTP_PORT:-1025}:1025
    networks:
      - app-development
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-02-03T21-03-04Z
    container_name: ${CONTAINER_PREFIX:-snapi}_minio
    command: minio server /data --console-address ":9001"
    volumes:
      - minio-data-development:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_root_user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_root_password}
    ports:
      - ${MINIO_PORT:-9000}:9000
      - ${MINIO_PORT_CONSOLE:-9001}:9001
    networks:
      - app-development
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: ${CONTAINER_PREFIX:-snapi}_kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data-development:/var/lib/kafka/data
    networks:
      - app-development

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ${CONTAINER_PREFIX:-snapi}_kafka_ui
    restart: unless-stopped
    ports:
      - "${KAFKA_UI_PORT:-8087}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: cinemate
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_started
    networks:
      - app-development

  ai-serve:
    container_name: ${CONTAINER_PREFIX:-snapi}_ai_serve
    build:
      context: .
      dockerfile: ./.docker/common/ai/serve/Dockerfile
    restart: unless-stopped
    environment:
      AI_ENABLE_KAFKA: "true"
      AI_STRICT_SEGMENT: "false"
      AI_MODEL_NAME: ${AI_MODEL_NAME:-vinai/phobert-base}
      AI_MODEL_PATH: ${AI_MODEL_PATH:-training/best_phobert_model.pt}
      AI_MAX_LENGTH: ${AI_MAX_LENGTH:-256}
      AI_DEVICE: ${AI_DEVICE:-auto}
      AI_VIOLATION_THRESHOLD: ${AI_VIOLATION_THRESHOLD:-0.8}
      AI_MODERATION_API_KEY: ${AI_MODERATION_API_KEY:-}
      VNCORENLP_JAR_PATH: ${VNCORENLP_JAR_PATH:-}
      VNCORENLP_MAX_HEAP_SIZE: ${VNCORENLP_MAX_HEAP_SIZE:--Xmx2g}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_MODERATION_REQUEST_TOPIC: moderation.request.v1
      KAFKA_MODERATION_RESULT_TOPIC: moderation.result.v1
      KAFKA_MODERATION_CONSUMER_GROUP: ai-moderator-v1
    ports:
      - "${AI_SERVE_PORT:-8001}:8001"
    volumes:
      - ./ai:/app
    depends_on:
      kafka:
        condition: service_started
    networks:
      - app-development

networks:
  app-development:

volumes:
  postgres-data-development:
  frontend_node_modules:
  minio-data-development:
  kafka-data-development:
