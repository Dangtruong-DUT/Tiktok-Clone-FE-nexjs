<svg fill="none" height="240" viewBox="0 0 600 600" width="240" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="grad_refined" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" style="stop-color:#FF9900;stop-opacity:1"></stop>
<stop offset="50%" style="stop-color:#FF00CC;stop-opacity:1"></stop>
<stop offset="100%" style="stop-color:#9900FF;stop-opacity:1"></stop>
</linearGradient>
<filter height="140%" id="shadow" width="140%" x="-20%" y="-20%">
<feGaussianBlur in="SourceAlpha" stdDeviation="5"></feGaussianBlur>
<feOffset dx="0" dy="5" result="offsetblur"></feOffset>
<feComponentTransfer>
<feFuncA slope="0.2" type="linear"></feFuncA>
</feComponentTransfer>
<feMerge>
<feMergeNode></feMergeNode>
<feMergeNode in="SourceGraphic"></feMergeNode>
</feMerge>
</filter>
</defs>
<!-- Bottom Layered Stroke for Depth -->
<path d="M165,540 L535,300 L250,300" opacity="0.9" stroke="#9900FF" stroke-linecap="round" stroke-linejoin="round" stroke-width="60"></path>
<!-- Main Triangle Base -->
<path d="M150,100 L500,300 L150,500 Z" fill="url(#grad_refined)" filter="url(#shadow)"></path>
<!-- Chat Bubble (Semi-transparent white with pointer) -->
<g transform="translate(150, 240)">
<!-- Bubble Body -->
<rect fill="white" fill-opacity="0.25" height="110" rx="15" stroke="white" stroke-width="2" width="180" x="0" y="0"></rect>
<!-- Bubble Pointer -->
<path d="M30,110 L30,140 L60,110 Z" fill="white" fill-opacity="0.25" stroke="white" stroke-linejoin="round" stroke-width="2"></path>
<!-- Three White Dots -->
<circle cx="50" cy="55" fill="white" r="10"></circle>
<circle cx="90" cy="55" fill="white" r="10"></circle>
<circle cx="130" cy="55" fill="white" r="10"></circle>
</g>
</svg>