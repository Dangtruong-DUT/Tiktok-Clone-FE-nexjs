name: ${COMPOSE_PROJECT_NAME:-tiktok_clone}_production

services:
  web-server:
    container_name: ${CONTAINER_PREFIX:-tiktok_clone}_web
    build:
      context: .
      dockerfile: ./.docker/production/backend/nginx/Dockerfile
    restart: unless-stopped
    environment:
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-*}
    volumes:
      - laravel-storage-production:/var/www/storage:ro
    networks:
      - app-production
    ports:
      - "${NGINX_PORT:-9696}:80"
    depends_on:
      php-fpm:
        condition: service_healthy
      frontend:
        condition: service_started

  php-fpm:
    container_name: ${CONTAINER_PREFIX:-tiktok_clone}_php-fpm
    build:
      context: .
      dockerfile: ./.docker/common/backend/php-fpm/Dockerfile
      target: production
      args:
        DOCKER_ENV: production
    restart: unless-stopped
    volumes:
      - laravel-storage-production:/var/www/storage
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env}
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: postgres
      REDIS_HOST: redis
    networks:
      - app-production
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    container_name: ${CONTAINER_PREFIX:-tiktok_clone}_postgres
    image: postgres:12.7
    restart: unless-stopped
    user: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tiktok_clone}
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tiktok_clone_password}
    volumes:
      - postgres-data-production:/var/lib/postgresql
    networks:
      - app-production
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: unless-stopped
    container_name: ${CONTAINER_PREFIX:-tiktok_clone}_redis
    networks:
      - app-production
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    container_name: ${CONTAINER_PREFIX:-tiktok_clone}_frontend
    build:
      context: .
      dockerfile: ./.docker/production/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_ENDPOINT: ${FRONTEND_PUBLIC_API_ENDPOINT}
        NEXT_PUBLIC_URL: ${FRONTEND_PUBLIC_URL}
        NEXT_PUBLIC_GOOGLE_AUTHORIZED_REDIRECT_URI: ${FRONTEND_PUBLIC_GOOGLE_AUTHORIZED_REDIRECT_URI}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${FRONTEND_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_APP_ENV: ${NEXT_APP_ENV:-production}
    restart: unless-stopped
    env_file:
      - ${FRONTEND_ENV_FILE:-./frontend/.env}
    environment:
      NODE_ENV: production
      NEXT_APP_ENV: ${NEXT_APP_ENV:-production}
      NEXT_PUBLIC_API_ENDPOINT: ${FRONTEND_PUBLIC_API_ENDPOINT}
      NEXT_PUBLIC_URL: ${FRONTEND_PUBLIC_URL}
      NEXT_PUBLIC_GOOGLE_AUTHORIZED_REDIRECT_URI: ${FRONTEND_PUBLIC_GOOGLE_AUTHORIZED_REDIRECT_URI}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${FRONTEND_PUBLIC_GOOGLE_CLIENT_ID}
      PORT: "3000"
    expose:
      - "3000"
    networks:
      - app-production

  mailcatcher:
    image: dockage/mailcatcher:0.7.1
    container_name: ${CONTAINER_PREFIX:-tiktok_clone}_mailcatcher
    profiles:
      - tools
    ports:
      - ${MAILCATCHER_WEB_PORT:-1080}:1080
      - ${MAILCATCHER_SMTP_PORT:-1025}:1025
    networks:
      - app-production
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-02-03T21-03-04Z
    container_name: ${CONTAINER_PREFIX:-tiktok_clone}_minio
    command: minio server /data --console-address ":9001"
    volumes:
      - minio-data-production:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_root_user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_root_password}
    ports:
      - ${MINIO_PORT:-9000}:9000
      - ${MINIO_PORT_CONSOLE:-9001}:9001
    networks:
      - app-production
    restart: unless-stopped

networks:
  app-production:

volumes:
  postgres-data-production:
  laravel-storage-production:
  minio-data-production:
